ServerRoot "/usr/local/apache2"

Listen 8080

Define DOCROOT "/usr/local/apache2/htdocs"

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule alias_module modules/mod_alias.so
LoadModule env_module modules/mod_env.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule headers_module modules/mod_headers.so

<IfModule unixd_module>
User daemon
Group daemon
</IfModule>

ServerAdmin admin@localhost
ServerName localhost:8080

<Directory />
    AllowOverride none
    Require all denied
</Directory>

DocumentRoot "${DOCROOT}"

<Directory "${DOCROOT}">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<IfModule dir_module>
DirectoryIndex index.html
</IfModule>

ErrorLog "logs/error.log"
LogLevel warn

<IfModule log_config_module>
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog "logs/access.log" combined
</IfModule>

<IfModule mime_module>
TypesConfig conf/mime.types
</IfModule>

AddDefaultCharset UTF-8

# ============================================
# Security Headers
# ============================================

# Content Security Policy
Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';"

# X-Frame-Options - prevent clickjacking
Header always set X-Frame-Options "SAMEORIGIN"

# X-Content-Type-Options - prevent MIME sniffing
Header always set X-Content-Type-Options "nosniff"

# X-XSS-Protection - legacy browser protection
Header always set X-XSS-Protection "1; mode=block"

# Referrer-Policy - control referrer information
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Permissions-Policy - control browser features
Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()"

# Strict-Transport-Security (HSTS) - HTTPS only
Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

# Remove server banner
ServerTokens Prod
