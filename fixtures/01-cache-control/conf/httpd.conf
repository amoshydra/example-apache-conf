ServerRoot "/usr/local/apache2"

Listen 8080

Define DOCROOT "/usr/local/apache2/htdocs"

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule alias_module modules/mod_alias.so
LoadModule env_module modules/mod_env.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule headers_module modules/mod_headers.so
LoadModule expires_module modules/mod_expires.so

<IfModule unixd_module>
User daemon
Group daemon
</IfModule>

ServerAdmin admin@localhost
ServerName localhost:8080

<Directory />
    AllowOverride none
    Require all denied
</Directory>

DocumentRoot "${DOCROOT}"

<Directory "${DOCROOT}">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<IfModule dir_module>
DirectoryIndex index.html
</IfModule>

ErrorLog "logs/error.log"
LogLevel warn

<IfModule log_config_module>
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog "logs/access.log" combined
</IfModule>

<IfModule mime_module>
TypesConfig conf/mime.types
</IfModule>

AddDefaultCharset UTF-8

# ============================================
# React Web App (Webpack) - Cache Control
# ============================================
# Use LocationMatch to match path and file pattern together

# React index.html - never cache
<LocationMatch "^/react-web/index\.html$">
    Header set Cache-Control "no-cache, no-store, must-revalidate"
    Header set Pragma "no-cache"
    Header set Expires "0"
</LocationMatch>

# React hashed assets (JS/CSS with content hash) - cache forever
<LocationMatch "^/react-web/.*\.(js|css)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>

# ============================================
# Angular Web App (CLI) - Cache Control
# ============================================

# Angular index.html - never cache
<LocationMatch "^/angular-web/index\.html$">
    Header set Cache-Control "no-cache, no-store, must-revalidate"
    Header set Pragma "no-cache"
    Header set Expires "0"
</LocationMatch>

# Angular main bundles with hash - cache forever
<LocationMatch "^/angular-web/main\.[a-z0-9]+\.(js|css)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>

# Angular runtime and polyfills with hash - cache forever
<LocationMatch "^/angular-web/(runtime|polyfills)\.[a-z0-9]+\.(js|css)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>

# Angular styles with hash - cache forever
<LocationMatch "^/angular-web/styles\.[a-z0-9]+\.css$">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>

# Angular assets folder - short cache for static assets
<LocationMatch "^/angular-web/assets/.*\.(png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|json)$">
    Header set Cache-Control "public, max-age=86400"
</LocationMatch>
