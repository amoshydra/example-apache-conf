name: Apache Fixtures Tests

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Permissions needed to commit README updates
permissions:
  contents: write

jobs:
  test-and-update-readme:
    runs-on: ubuntu-latest
    name: "Run Tests and Update README"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Need full history to commit back
          fetch-depth: 0
          # Use token that can push
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install BATS
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
          bats --version

      - name: Set up Podman
        run: |
          sudo apt-get install -y podman

      - name: Run All Tests
        id: tests
        run: |
          cd test
          
          # Run all tests and capture output
          bats --tap *.bats > ../test-results.tap 2>&1 || true
          
          # Display results
          cat ../test-results.tap
        env:
          BATS_TEST_TIMEOUT: 60

      - name: Parse Results and Update README
        run: |
          # Parse TAP output
          TOTAL_PASSED=0
          TOTAL_FAILED=0
          TOTAL_SKIPPED=0
          
          while IFS= read -r line; do
            if [[ "$line" =~ ^ok[[:space:]][0-9]+ ]]; then
              if [[ "$line" =~ \#\ skip ]]; then
                TOTAL_SKIPPED=$((TOTAL_SKIPPED + 1))
              else
                TOTAL_PASSED=$((TOTAL_PASSED + 1))
              fi
            elif [[ "$line" =~ ^not[[:space:]]ok[[:space:]][0-9]+ ]]; then
              TOTAL_FAILED=$((TOTAL_FAILED + 1))
            fi
          done < test-results.tap
          
          # Generate fixture results
          F01_PASSED=$(grep -c "^ok.*01-" test-results.tap || true)
          F01_FAILED=$(grep -c "^not ok.*01-" test-results.tap || true)
          F01_TOTAL=$((F01_PASSED + F01_FAILED))
          F01_ICON="✅"
          [ $F01_FAILED -gt 0 ] && F01_ICON="❌"
          [ $F01_TOTAL -eq 0 ] && F01_ICON="⏳"
          
          F02_PASSED=$(grep -c "^ok.*02-" test-results.tap || true)
          F02_FAILED=$(grep -c "^not ok.*02-" test-results.tap || true)
          F02_TOTAL=$((F02_PASSED + F02_FAILED))
          F02_ICON="✅"
          [ $F02_FAILED -gt 0 ] && F02_ICON="❌"
          [ $F02_TOTAL -eq 0 ] && F02_ICON="⏳"
          
          F03_PASSED=$(grep -c "^ok.*03-" test-results.tap || true)
          F03_FAILED=$(grep -c "^not ok.*03-" test-results.tap || true)
          F03_TOTAL=$((F03_PASSED + F03_FAILED))
          F03_ICON="✅"
          [ $F03_FAILED -gt 0 ] && F03_ICON="❌"
          [ $F03_TOTAL -eq 0 ] && F03_ICON="⏳"
          
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          
          # Create new results section
          echo "<!-- TEST-RESULTS-START -->" > new-results.txt
          echo "" >> new-results.txt
          echo "## Test Results (Auto-generated)" >> new-results.txt
          echo "" >> new-results.txt
          echo "| Fixture | Status | Description |" >> new-results.txt
          echo "|---------|--------|-------------|" >> new-results.txt
          echo "| 01 Cache Control | $F01_ICON $F01_PASSED/$F01_TOTAL | React & Angular cache headers |" >> new-results.txt
          echo "| 02 Security Headers | $F02_ICON $F02_PASSED/$F02_TOTAL | CSP, HSTS, X-Frame-Options |" >> new-results.txt
          echo "| 03 Cache Conflict | $F03_ICON $F03_PASSED/$F03_TOTAL | Documents directive conflicts |" >> new-results.txt
          echo "" >> new-results.txt
          echo "**Summary:** $TOTAL_PASSED passed, $TOTAL_FAILED failed, $TOTAL_SKIPPED skipped" >> new-results.txt
          echo "" >> new-results.txt
          echo "*Last updated: $TIMESTAMP*" >> new-results.txt
          echo "<!-- TEST-RESULTS-END -->" >> new-results.txt
          
          # Update README using sed
          if grep -q "<!-- TEST-RESULTS-START -->" README.md; then
            # Replace between markers
            sed -i '/<!-- TEST-RESULTS-START -->/,/<!-- TEST-RESULTS-END -->/c\<!-- TEST-RESULTS-START -->\n' README.md
            sed -i '/<!-- TEST-RESULTS-START -->/r new-results.txt' README.md
            # Remove the marker line that was duplicated
            sed -i '/^<!-- TEST-RESULTS-START -->$/{N;d}' README.md 2>/dev/null || true
          else
            # Insert after first heading
            sed -i '0,/^# .*/s//\# Apache Configuration Test Fixtures\n\n<!-- TEST-RESULTS-START -->\n## Test Results (Pending)\n\n*Tests have not run yet*\n<!-- TEST-RESULTS-END -->/' README.md
          fi
          
          rm -f new-results.txt test-results.tap
          echo "Updated README with test results"

      - name: Commit README Update
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to README"
          else
            git commit -m "docs: update test results in README [skip ci]"
            git push
          fi

      - name: Generate Job Summary
        run: |
          echo "## Apache Fixtures Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat README.md | awk '/TEST-RESULTS-START/,/TEST-RESULTS-END/' >> $GITHUB_STEP_SUMMARY
