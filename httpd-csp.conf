# Test 1: CSP value broken across multiple lines using backslash continuation
Header always set Content-Security-Policy-1 "\
    default-src 'self';\
    script-src 'self';\
    style-src 'self' 'unsafe-inline';\
    img-src 'self' data:;\
    font-src 'self';\
    object-src 'none';\
    frame-ancestors 'none';\
    form-action 'self';"

# Test 2: CSP assembled via multiple Header append directives
Header always set Content-Security-Policy-2 "default-src 'self'"
Header always append Content-Security-Policy-2 "script-src 'self'"
Header always append Content-Security-Policy-2 "style-src 'self' 'unsafe-inline'"
Header always append Content-Security-Policy-2 "img-src 'self' data:"

# Test 3: Single-line CSP (control)
Header always set Content-Security-Policy-3 "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"

# Load modules needed for SSI and UNIQUE_ID
LoadModule unique_id_module modules/mod_unique_id.so
LoadModule include_module modules/mod_include.so
LoadModule filter_module modules/mod_filter.so

# Enable SSI (Server-Side Includes) for HTML
AddOutputFilterByType INCLUDES text/html

<Directory "/usr/local/apache2/htdocs">
    Options Indexes FollowSymLinks Includes
</Directory>

# Test 5: CSP with dynamic nonce using UNIQUE_ID (per-request unique value)
# %{UNIQUE_ID}e expands via mod_headers' expr= — each request gets a unique nonce
Header always set Content-Security-Policy "\
default-src 'self';\
script-src 'self' 'nonce-%{UNIQUE_ID}e';\
style-src 'self' 'unsafe-inline';\
img-src 'self' data:;\
font-src 'self';\
frame-ancestors 'none';\
form-action 'self';"

# Test 6: %{UNIQUE_ID} without 'e' suffix — this will FAIL
# Apache requires the type suffix on %{VAR}: e=env, s=SSL, i=in, o=out
# Without 'e': "Unrecognized header format %{}"
