<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "${DOCROOT}"

    ErrorLog "logs/localhost-error.log"
    CustomLog "logs/localhost-access.log" combined

    <Directory "${DOCROOT}">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # If-else inside location block
    <Location /api>
        <If "%{QUERY_STRING} =~ /mode=admin/">
            Require all granted
        </If>
        <Else>
            Require ip 127.0.0.1
        </Else>
    </Location>
</VirtualHost>